<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ドーナツ形状（Torus）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe3e8;font-family:"Segoe UI","Meiryo",sans-serif;}
  #info{position:absolute;top:10px;left:10px;padding:6px 10px;background:rgba(255,255,255,.85);border-radius:6px;font-size:13px;color:#333;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">左ドラッグ：回転　右ドラッグ：移動　ホイール：ズーム</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// 寸法（任意単位）
const R = 5;    // 大半径（中心～管中心）
const r = 1.5;  // 小半径（管の断面半径）

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3e8);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(14, 11, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, r, 0);

// ライト
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(10, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
scene.add(sun);

// ドーナツ（トーラス）
const geometry = new THREE.TorusGeometry(R, r, 64, 200);
const material = new THREE.MeshStandardMaterial({ color: 0xe0a458, roughness: 0.45, metalness: 0.0 });
const torus = new THREE.Mesh(geometry, material);
torus.rotation.x = -Math.PI / 2; // 水平に寝かせる
torus.position.y = r;            // 床に接地（めり込み防止）
torus.castShadow = true;
torus.receiveShadow = true;
scene.add(torus);

// 床
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0xf2f4f6, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(60, 60, 0xaab0b8, 0xc8cdd3);
grid.position.y = 0.002;
scene.add(grid);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
