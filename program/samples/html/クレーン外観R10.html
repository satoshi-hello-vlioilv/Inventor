<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天井クレーン 4本吊りモデル</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        let scene, camera, renderer, controls;

        const materials = {
            craneYellow: new THREE.MeshStandardMaterial({ color: 0xffa500, metalness: 0.8, roughness: 0.4 }),
            darkMetal: new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.3 }),
            wire: new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.9, roughness: 0.3 }),
            cargo: new THREE.MeshStandardMaterial({ color: 0x808080, metalness: 0.1, roughness: 0.8 }),
            floor: new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 0.8, metalness: 0 }),
            shackle: new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.4 }),
            hookBlockBlue: new THREE.MeshStandardMaterial({ color: 0x00529b, metalness: 0.7, roughness: 0.5 }),
            hookBlockYellow: new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.4 }),
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xadd8e6);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 9, 0);
            controls.enableDamping = true;

            createEnvironment();
            
            const crane = createCrane();
            crane.position.set(0, 22, 0); 
            scene.add(crane);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createEnvironment() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(15, 25, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 4096;
            dirLight.shadow.mapSize.height = 4096;
            dirLight.shadow.camera.top = 40;
            dirLight.shadow.camera.bottom = -40;
            dirLight.shadow.camera.left = -40;
            dirLight.shadow.camera.right = -40;
            scene.add(dirLight);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), materials.floor);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            new RGBELoader().load('https://unpkg.com/three@0.160.0/examples/textures/equirectangular/industrial_workshop_foundry_1k.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
            });
        }
        
        function createCrane() {
            const craneGroup = new THREE.Group();
            const girderLength = 20;
            const mainGirder1 = createGirder(girderLength, materials.craneYellow);
            mainGirder1.position.z = -2.5;
            craneGroup.add(mainGirder1);
            const mainGirder2 = createGirder(girderLength, materials.craneYellow);
            mainGirder2.position.z = 2.5;
            craneGroup.add(mainGirder2);
            const trolley = createTrolley();
            trolley.position.set(0, 0.55, 0);
            craneGroup.add(trolley);
            const liftingAssembly = createLiftingAssembly();
            liftingAssembly.position.copy(trolley.position);
            liftingAssembly.position.y -= 0.55;
            craneGroup.add(liftingAssembly);
            return craneGroup;
        }

        function createGirder(length, material) {
            const shape = new THREE.Shape();
            const w = 0.5, h = 0.4, tf = 0.08, tw = 0.05;
            shape.moveTo(-w, h); shape.lineTo(w, h); shape.lineTo(w, h - tf); shape.lineTo(tw, h - tf); shape.lineTo(tw, -h + tf); shape.lineTo(w, -h + tf); shape.lineTo(w, -h); shape.lineTo(-w, -h); shape.lineTo(-w, -h + tf); shape.lineTo(-tw, -h + tf); shape.lineTo(-tw, h - tf); shape.lineTo(-w, h - tf); shape.closePath();
            const geometry = new THREE.ExtrudeGeometry(shape, { depth: length, bevelEnabled: false });
            geometry.center();
            geometry.rotateY(Math.PI / 2);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true; mesh.receiveShadow = true;
            return mesh;
        }

        function createTrolley() {
            const trolleyGroup = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.4, 5.2), materials.darkMetal);
            trolleyGroup.add(frame);
            const hoistBody = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.5, 32), materials.darkMetal);
            hoistBody.rotateX(Math.PI / 2);
            hoistBody.position.y = 0.5;
            trolleyGroup.add(hoistBody);
            const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 32), materials.darkMetal);
            motor.rotateX(Math.PI / 2);
            motor.position.set(0, 0.5, 1.8);
            trolleyGroup.add(motor);
            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 24);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1.0, roughness: 0.4 });
            [[1.5, 0, 2.5], [-1.5, 0, 2.5], [1.5, 0, -2.5], [-1.5, 0, -2.5]]
                .forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeo, wheelMaterial);
                    wheel.rotateX(Math.PI / 2);
                    wheel.position.set(pos[0], pos[1], pos[2]);
                    trolleyGroup.add(wheel);
                });
            trolleyGroup.traverse(child => { child.castShadow = true; });
            return trolleyGroup;
        }
        
        function createLiftingAssembly() {
            const assemblyGroup = new THREE.Group();
            const hookBlockAssembly = createHookBlockAssembly();
            hookBlockAssembly.position.y = -10;
            assemblyGroup.add(hookBlockAssembly);
            const cargo = createCargo();
            cargo.position.y = -18;
            assemblyGroup.add(cargo);
            const ringRadius = 0.3, ringTubeRadius = 0.06;
            const masterLink = new THREE.Mesh(new THREE.TorusGeometry(ringRadius, ringTubeRadius, 16, 48), materials.shackle);
            const hookScale = 0.8, hookOffsetY = -0.9, hookSaddleBaseY = -2.5 * hookScale;
            const hookSaddleLocalY = hookSaddleBaseY + hookOffsetY;
            const hookSaddleGlobalY = hookBlockAssembly.position.y + hookSaddleLocalY;
            const ringInnerRadius = ringRadius - ringTubeRadius;
            const masterLinkCenterY = hookSaddleGlobalY - ringInnerRadius;
            masterLink.position.set(0, masterLinkCenterY, 0);
            masterLink.rotation.x = Math.PI / 2;
            masterLink.rotation.y = Math.PI / 2;
            masterLink.castShadow = true;
            assemblyGroup.add(masterLink);
            const sheaveRadius = 0.5;
            const wireStartLeft = new THREE.Vector3(-sheaveRadius, hookBlockAssembly.position.y, 0);
            const wireStartRight = new THREE.Vector3(sheaveRadius, hookBlockAssembly.position.y, 0);
            const wireEndLeft = new THREE.Vector3(-sheaveRadius, 0, 0);
            const wireEndRight = new THREE.Vector3(sheaveRadius, 0, 0);
            assemblyGroup.add(createCylinderBetweenPoints(wireStartLeft, wireEndLeft, 0.03, materials.wire));
            assemblyGroup.add(createCylinderBetweenPoints(wireStartRight, wireEndRight, 0.03, materials.wire));
            const wireJunctionPoint = masterLink.position.clone();
            wireJunctionPoint.y -= ringRadius;
            const cargoW = 4, cargoD = 2.5, cargoH = 2;
            const cargoPoints = [
                new THREE.Vector3(cargoW / 2, cargoH / 2, cargoD / 2), new THREE.Vector3(cargoW / 2, cargoH / 2, -cargoD / 2),
                new THREE.Vector3(-cargoW / 2, cargoH / 2, cargoD / 2), new THREE.Vector3(-cargoW / 2, cargoH / 2, -cargoD / 2)
            ].map(p => p.add(cargo.position));
            cargoPoints.forEach(point => {
                assemblyGroup.add(createCylinderBetweenPoints(wireJunctionPoint, point, 0.03, materials.wire));
            });
            return assemblyGroup;
        }

        // 【修正箇所】ヨークフレームの向きを修正
        function createHookBlockAssembly() {
            const group = new THREE.Group();
            const sheaveDiameter = 1.0, sheaveThickness = 0.3;
            
            // 1. 青いシーブ（滑車）
            const sheave = new THREE.Mesh(new THREE.CylinderGeometry(sheaveDiameter / 2, sheaveDiameter / 2, sheaveThickness, 32), materials.hookBlockBlue);
            sheave.rotateX(Math.PI / 2);
            group.add(sheave);

            // 2. 黄色いヨーク（フレーム）
            // BoxGeometry(width, height, depth) -> (X, Y, Z)
            const plateWidth = 0.8; // フレームの幅 (X方向)
            const plateHeight = 1.2; // フレームの高さ (Y方向)
            const plateThickness = 0.15; // フレームの厚み (Z方向)
            const plateGeo = new THREE.BoxGeometry(plateWidth, plateHeight, plateThickness);
            
            const gap = sheaveThickness + 0.1; // 滑車との隙間
            const platePosZ = gap / 2 + plateThickness / 2;

            const yorkPlate1 = new THREE.Mesh(plateGeo, materials.hookBlockYellow);
            yorkPlate1.position.set(0, -0.4, -platePosZ);
            const yorkPlate2 = yorkPlate1.clone();
            yorkPlate2.position.z = platePosZ;
            group.add(yorkPlate1, yorkPlate2);

            // 3. フック
            const scale = 0.8;
            const hookCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -0.8, 0),
                new THREE.Vector3(0.8, -1.8, 0), new THREE.Vector3(0, -2.5, 0),
                new THREE.Vector3(-0.7, -1.8, 0), new THREE.Vector3(-0.6, -1.4, 0)
            ].map(p => p.multiplyScalar(scale)));
            const hook = new THREE.Mesh(new THREE.TubeGeometry(hookCurve, 48, 0.15 * scale, 16, false), materials.shackle);
            hook.position.y = -0.9;
            group.add(hook);
            
            // 4. ピン類
            const pinLength = 2 * platePosZ;
            const sheavePin = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, pinLength, 16), materials.darkMetal);
            sheavePin.rotateX(Math.PI / 2);
            group.add(sheavePin);

            const hookPin = sheavePin.clone();
            hookPin.position.y = -0.8;
            group.add(hookPin);

            group.traverse(child => { child.castShadow = true; });
            return group;
        }

        function createCargo() {
            const cargoGroup = new THREE.Group();
            const w = 4, h = 2, d = 2.5;
            cargoGroup.add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), materials.cargo));
            const lugGeo = new THREE.TorusGeometry(0.15, 0.05, 16, 32);
            [[w/2, h/2, d/2], [w/2, h/2, -d/2], [-w/2, h/2, d/2], [-w/2, h/2, -d/2]]
                .forEach(pos => {
                    const lug = new THREE.Mesh(lugGeo, materials.darkMetal);
                    lug.position.set(pos[0], pos[1], pos[2]);
                    cargoGroup.add(lug);
                });
            cargoGroup.traverse(child => { child.castShadow = true; });
            return cargoGroup;
        }

        function createCylinderBetweenPoints(v1, v2, radius, material) {
            const distance = v1.distanceTo(v2);
            const position = v1.clone().add(v2).divideScalar(2);
            const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, distance, 16), material);
            cylinder.position.copy(position);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v2.clone().sub(v1).normalize());
            cylinder.castShadow = true;
            return cylinder;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
