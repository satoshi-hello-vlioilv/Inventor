# デスクトップ版（desktop/・Tauri）を Windows で作り、本物の WebView2 で自己診断する（WaveLog と同じ配り方）。
#
# 1. 網: cargo test（作る仕事・画面を配る・受け取ったファイル・孫まで止める。Windows のジョブオブジェクトとレジストリを含む）と、
#        Python の網のうち OS で振る舞いが違いうるもの（配る形・作る係）
# 2. cargo build --release
# 3. 作った exe を最上位に置いて、サンプルの組立（.iam）を渡して起こす（エクスプローラーで exe へドロップしたのと同じ）。
#    画面が合図（stage=second）を出したら、2 つめの exe に変換データ（.inventor.json）を渡して起こす（1 つめの窓が受け取る）。
#    画面は「STEP を作る」ボタンで STEP を作り、窓は INVENTOR_TOOL_SELFTEST に結果を書いて終わる（src/selftest.js）。
#    結果と exe は Artifacts に置く。
#
# 4. 配る ZIP（exe と、program の中で動かすのに要る物だけ。サンプル・試験・道具は外す）を exe の --pack で作り、
#    その ZIP で版の管理（置き場から入れる・そろえる）を本物の Windows で確かめる。
# 5. main への push では、通った exe を最上位の Inventor3DTool.exe として main へ置く（publish）。
#    利用者は main の ZIP を落として展開するので、exe も同じ ZIP で届く（exe と program の組がずれない）。
#    置くのは「窓の元（desktop/・app_icon.py）が前に置いた exe と違う」ときだけ（program/Inventor3DTool.build.json の指紋）。
#    配る ZIP は、版（program/version.json）ごとに 1 つ GitHub の Releases に置く（版の管理の「ZIP から版を置く」で選ぶ軽い ZIP）。
name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "program/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "program/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

# main へ続けて入っても、置くのは 1 本ずつ（後から来たほうが待つ）
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      # exe が名乗る「作ったコミット」。publish が Inventor3DTool.build.json に書く commit と同じ値
      INVENTOR_TOOL_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python の網（配る形・作る係）
        working-directory: program
        run: python -m unittest tests.test_layout tests.test_builder -v

      # ここから先は、前の段が落ちても走らせる（1 回の CI で全ての段の結果が分かる。どれかが落ちればジョブは失敗）
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() }}
        with:
          workspaces: desktop

      - name: Rust の網
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          $env:INVENTOR_TOOL_PYTHON = (Get-Command python).Source
          cargo test --locked

      - name: exe を作る
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          $env:INVENTOR_TOOL_PYTHON = (Get-Command python).Source
          cargo build --release --locked

      - name: 自己診断（本物の WebView2・ドロップと 2 つめの起動・STEP を作る）
        if: ${{ !cancelled() }}
        run: |
          Copy-Item desktop\target\release\Inventor3DTool.exe .\Inventor3DTool.exe
          $out = "$env:RUNNER_TEMP\selftest.json"
          $env:INVENTOR_TOOL_SELFTEST = $out
          $iam = (Get-ChildItem program\samples\iam\*.iam | Select-Object -First 1).FullName
          $spec = (Resolve-Path program\tests\fixtures\builder\finger.inventor.json).Path
          $first = Start-Process -FilePath .\Inventor3DTool.exe -ArgumentList ('"{0}"' -f $iam) -PassThru
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path "$out.second") -and -not (Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          $secondExited = $false
          if (Test-Path "$out.second") {
            $second = Start-Process -FilePath .\Inventor3DTool.exe -ArgumentList ('"{0}"' -f $spec) -PassThru
            $secondExited = $second.WaitForExit(30000)
            Write-Host "2 つめの起動: 終わった=$secondExited 終了コード=$($second.ExitCode)"
          } else { Write-Host "画面が 2 つめの起動の合図を出していません" }
          $deadline = (Get-Date).AddSeconds(360)
          while (-not (Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          $firstExited = $first.WaitForExit(60000)
          Get-ChildItem "$env:LOCALAPPDATA\Inventor3DTool\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 30 -Encoding utf8 }
          if (-not (Test-Path $out)) { Write-Host "結果のファイルがありません"; exit 2 }
          $r = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
          $r.results | ForEach-Object { Write-Host ("{0}: {1} -- {2}" -f ($(if ($_.ok) { "PASS" } else { "FAIL" })), $_.name, $_.info) }
          if ($r.error) { Write-Host "ERROR: $($r.error)" }
          if (-not $firstExited) { Write-Host "窓が結果を書いたあとに終わっていません"; exit 3 }
          if (-not $secondExited) { Write-Host "2 つめの起動がすぐに終わっていません（1 つだけ起動の仕組み）"; exit 3 }
          $step = Get-ChildItem -Path $r.job.out_dir -Filter *.stp -ErrorAction SilentlyContinue
          if (-not $step) { Write-Host "STEP が保存先にありません: $($r.job.out_dir)"; exit 4 }
          Write-Host "STEP: $($step.FullName)（$($step.Length) バイト）"
          if (Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*hostedtoolcache*" }) { Write-Host "作る係（Python）が残っています"; exit 5 }
          if (-not $r.ok) { exit 1 }

      # 配る ZIP: exe（作った物）と、program の中で動かすのに要る物だけ（desktop/src/update.rs の PAYLOAD。サンプル・試験・道具は外す）
      - name: 配る ZIP を作る（--pack）
        if: ${{ !cancelled() }}
        run: |
          Copy-Item desktop\target\release\Inventor3DTool.exe .\Inventor3DTool.exe -Force
          $ver = (Get-Content program\version.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\pack" | Out-Null
          $zip = "$env:RUNNER_TEMP\pack\Inventor3DTool-$ver.zip"
          $p = Start-Process -FilePath .\Inventor3DTool.exe -ArgumentList @('--pack', "`"$((Resolve-Path .).Path)`"", "`"$zip`"") -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\pack.txt"
          Get-Content "$env:RUNNER_TEMP\pack.txt" -Encoding utf8 | Write-Host
          if ($p.ExitCode -ne 0 -or -not (Test-Path $zip)) { Write-Host "配る ZIP を作れません"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries.FullName
          $archive.Dispose()
          $extra = $names | Where-Object { $_ -match '/program/(samples|tests|tools|config)/' }
          if ($extra) { Write-Host "配らない物が入っています: $($extra | Select-Object -First 5)"; exit 2 }
          Write-Host ("配る ZIP: {0} ファイル・{1:N1} MB" -f $names.Count, ((Get-Item $zip).Length / 1MB))

      # 版の管理（desktop/src/update.rs・launch.rs）を本物の Windows で: 置き場に配る ZIP の版を置き（--publish-zip）、
      # 置き場の入口 exe → この PC のフォルダへ写してそろえ、ショートカットを作り、開き直す。2 つめの版では、動いている自分の exe を入れ替える
      - name: 版の管理（置き場から入れる・ショートカット・起動でそろえる・動いている exe の入れ替え）
        if: ${{ !cancelled() }}
        run: |
          $root = "$env:RUNNER_TEMP\upd"; $share = "$root\share"; $homeApp = "$root\home"
          New-Item -ItemType Directory -Force $share | Out-Null
          $exe = (Resolve-Path desktop\target\release\Inventor3DTool.exe).Path
          $base = (Get-Content program\version.json -Raw | ConvertFrom-Json).version
          $packed = "$env:RUNNER_TEMP\pack\Inventor3DTool-$base.zip"
          # 配る ZIP の版の番号だけを変えた ZIP（同じ番号は置き場が受け付けない）
          function Make-Zip([string]$ver) {
            $dir = "$root\zip-$ver"
            Expand-Archive $packed $dir -Force
            $inner = (Get-ChildItem $dir -Directory | Select-Object -First 1).FullName
            ('{"version": "' + $ver + '"}') | Set-Content -Encoding utf8 "$inner\program\version.json"
            Compress-Archive -Path $inner -DestinationPath "$root\$ver.zip" -Force
            return "$root\$ver.zip"
          }
          function Wait-For([scriptblock]$ok, [int]$sec) {
            $deadline = (Get-Date).AddSeconds($sec)
            while (-not (& $ok) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            return (& $ok)
          }
          function Version-Of([string]$app) { try { (Get-Content "$app\program\version.json" -Raw | ConvertFrom-Json).version } catch { "" } }
          function Running([string]$path) { @(Get-Process Inventor3DTool -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $path }).Count -gt 0 }
          # exe は窓のアプリなので、& では終わりを待たない（$LASTEXITCODE も前の命令のまま）。待って終了コードを返す
          function Publish([string]$zip) {
            $p = Start-Process -FilePath $exe -ArgumentList @('--publish-zip', "`"$zip`"", "`"$share`"") -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$root\publish.txt"
            Get-Content "$root\publish.txt" -Encoding utf8 | Write-Host
            return $p.ExitCode
          }
          $env:INVENTOR_TOOL_INSTALL_ROOT = $homeApp
          $v1 = "$base-ci1"; $v2 = "$base-ci2"
          if ((Publish (Make-Zip $v1)) -ne 0) { Write-Host "置き場に $v1 を置けません"; exit 11 }
          Start-Process -FilePath "$share\Inventor3DTool.exe"
          $installed = Wait-For { (Version-Of $homeApp) -eq $v1 -and (Running "$homeApp\Inventor3DTool.exe") } 120
          Write-Host "置き場の入口から入れた: $installed（版 $(Version-Of $homeApp)）"
          # 置き場の最上位は入口の exe と versions だけ（配る版・役割・残す数は versions の中）
          $top = (Get-ChildItem $share | ForEach-Object Name | Sort-Object) -join ","
          $layout = $top -eq "Inventor3DTool.exe,versions" -and (Test-Path "$share\versions\release.json")
          Write-Host "置き場の最上位: $top（形が正しい: $layout）"
          # 入れたとき、デスクトップにこの PC の exe を指すショートカットを作った。名前は ASCII の型で探す
          # （この段の台本の日本語は、PowerShell が別の文字コードで読むので、文字列のままでは名前が合わない）
          $desk = [Environment]::GetFolderPath('Desktop')
          $found = Wait-For { @(Get-ChildItem -LiteralPath $desk -Filter "Inventor 3D*.lnk" -ErrorAction SilentlyContinue).Count -gt 0 } 10
          $lnk = if ($found) { (Get-ChildItem -LiteralPath $desk -Filter "Inventor 3D*.lnk" | Select-Object -First 1).FullName } else { "" }
          # 指す先: ショートカットのファイルの中に、この PC の exe の道が（ANSI か UTF-16 で）書いてあるか
          # （WScript.Shell の TargetPath はこの環境で空を返すので使わない。窓の自己確認は IShellLink で「この exe を指す」と記録する）
          $want = "$homeApp\Inventor3DTool.exe"
          $bytes = if ($found) { [IO.File]::ReadAllBytes($lnk) } else { [byte[]]@() }
          $linked = $found -and ([Text.Encoding]::Unicode.GetString($bytes).Contains($want) -or [Text.Encoding]::Default.GetString($bytes).Contains($want))
          Write-Host "デスクトップのショートカット: $linked（$lnk が $want を指すか）"
          if (-not $linked) {
            # 見つからないときの手がかり: デスクトップの場所と、見える .lnk の一覧
            Write-Host "Desktop: $([Environment]::GetFolderPath('Desktop')) / DesktopDirectory: $([Environment]::GetFolderPath('DesktopDirectory'))"
            foreach ($d in @([Environment]::GetFolderPath('Desktop'), "$env:PUBLIC\Desktop", [Environment]::GetFolderPath('Programs'))) {
              Get-ChildItem -LiteralPath $d -Filter *.lnk -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          }
          Get-Process Inventor3DTool -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if ((Publish (Make-Zip $v2)) -ne 0) { Write-Host "置き場に $v2 を置けません"; exit 12 }
          Start-Process -FilePath "$homeApp\Inventor3DTool.exe"
          $updated = Wait-For { (Version-Of $homeApp) -eq $v2 -and (Test-Path "$homeApp\.update\$v1.old\Inventor3DTool.exe") -and (Running "$homeApp\Inventor3DTool.exe") } 120
          Write-Host "起動でそろえた: $updated（版 $(Version-Of $homeApp)・前の exe は .update\$v1.old へ）"
          Get-Process Inventor3DTool -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:LOCALAPPDATA\Inventor3DTool\logs\desktop.log" -Tail 30 -Encoding utf8 -ErrorAction SilentlyContinue
          if (-not $installed) { exit 13 }
          if (-not $updated) { exit 14 }
          if (-not $layout) { exit 15 }
          if (-not $linked) { exit 16 }
          exit 0

      # 置く物をまとめる: exe・自己診断の結果・作った元の指紋（publish が比べる）
      - name: 成果物をまとめる
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path desktop\target\release\Inventor3DTool.exe) { Copy-Item desktop\target\release\Inventor3DTool.exe $out }
          if (Test-Path "$env:RUNNER_TEMP\selftest.json") { Copy-Item "$env:RUNNER_TEMP\selftest.json" $out }
          if (Test-Path "$env:RUNNER_TEMP\pack") { Copy-Item "$env:RUNNER_TEMP\pack\*.zip" $out }
          "desktop:$(git rev-parse HEAD:desktop) icon:$(git rev-parse HEAD:program/tools/app_icon.py)" | Set-Content -NoNewline -Encoding ascii "$out\source.txt"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Inventor3DTool-windows
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

  # main へ入ったときだけ、通った exe を main へ置く。書く権限はこの段だけが持つ
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: Inventor3DTool-windows
          path: built
      - name: exe を main へ置く
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          built="$(cat built/source.txt)"
          now="desktop:$(git rev-parse HEAD:desktop) icon:$(git rev-parse HEAD:program/tools/app_icon.py)"
          # 作っているあいだに窓の元が変わった——古い exe で上書きしない（後の版が置く）
          if [ "$built" != "$now" ]; then echo "窓の元が作った後に変わったので置かない（後の版が置く）"; exit 0; fi
          have="$(python3 -c "import json;print(json.load(open('program/Inventor3DTool.build.json',encoding='utf-8'))['source'])" 2>/dev/null || true)"
          if [ "$have" = "$now" ] && [ -f Inventor3DTool.exe ]; then echo "同じ元から作った exe がもう置いてある"; exit 0; fi
          python3 - "$now" "$BUILT_SHA" <<'PY'
          import datetime, json, pathlib, re, shutil, sys
          src, sha = sys.argv[1], sys.argv[2]
          shutil.copyfile('built/Inventor3DTool.exe', 'Inventor3DTool.exe')
          st = json.load(open('built/selftest.json', encoding='utf-8'))
          ver = re.search(r'^version = "([^"]+)"', open('desktop/Cargo.toml', encoding='utf-8').read(), re.M).group(1)
          info = {'source': src, 'commit': sha, 'version': ver,
                  'builtAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'size': pathlib.Path('Inventor3DTool.exe').stat().st_size,
                  'selftest': f"{sum(r['ok'] for r in st['results'])}/{len(st['results'])}"}
          pathlib.Path('program/Inventor3DTool.build.json').write_text(json.dumps(info, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          print(info)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Inventor3DTool.exe program/Inventor3DTool.build.json
          git commit -m "デスクトップ版の exe を置く（${BUILT_SHA:0:7} から作った・自己診断を通った物）[skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
      # 配る ZIP を Releases に置く（版ごとに 1 つ。同じ版がもう置いてあれば置かない: 版を上げた main だけが置く）
      - name: 配る ZIP を Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="$(python3 -c "import json;print(json.load(open('program/version.json',encoding='utf-8'))['version'])")"
          zip="built/Inventor3DTool-$ver.zip"
          if [ ! -f "$zip" ]; then echo "配る ZIP がありません: $zip"; exit 1; fi
          if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver はもう Releases に置いてある"; exit 0; fi
          gh release create "v$ver" "$zip" --target "$BUILT_SHA" --title "Inventor 3Dツール $ver" \
            --notes "版の管理の「ZIP から版を置く」で選ぶ、配る ZIP（exe と、動かすのに要る物だけ。サンプル・試験・道具は含みません）。$(unzip -l "$zip" | tail -1)"
