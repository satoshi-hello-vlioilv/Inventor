# 確かめ（CLAUDE.md「push の前に、ローカルで全ての確かめを通す」の 3 つ: 型・構文、lint、試験）を、PR と main への push のたびに Linux で回す。
# 手元で回し忘れた変更も、main へ入る前に止める（2.10.0〜。それまで CI が回していたのは、desktop.yml の Python の一部・Rust・Windows の自己診断だけ）。
# Windows の本物の WebView2 での自己診断と、exe・配る ZIP は desktop.yml。
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # ruff は版で既定の規則が変わるので、規則は ruff.toml で決め、版も手元とそろえる（0.17 で既定の規則が増え、手元で通る物が落ちた）
      - name: 道具（ruff・OpenCascade。OpenCascade は STEP の試験を飛ばさないため）
        run: python -m pip install ruff==0.15.8 cadquery-ocp
      - name: 窓（Tauri）を Linux で作るのに要る物
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # 1. 型・構文（JavaScript・Python・Rust）
      - name: 型・構文（JavaScript）
        run: find program/app/static/js program/tests/js program/tools desktop/src \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: 型・構文（Python）
        run: python -m compileall -q program
      - name: 型（Rust）
        working-directory: desktop
        run: cargo check --all-targets
      # 2. lint（Python・Rust）
      - name: lint（Python）
        run: ruff check program
      - name: lint（Rust）
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      # 3. 試験（JavaScript・Python・Rust）
      - name: 試験（JavaScript）
        run: npm test
      - name: 試験（Python）
        working-directory: program
        run: python -m unittest discover -s tests -t .
      - name: 試験（Rust）
        working-directory: desktop
        run: cargo test
