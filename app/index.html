<title>Inventor 部品ビューア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* レイアウト: 製図台。作業面（3D ビュー）を主役に、右端に検図欄のような仕様パネルを置く */
:root {
  --bg: #e8ecf0;
  --stage-top: #f7f9fb;
  --stage-bottom: #d6dde5;
  --panel: #f8fafc;
  --ink: #16202b;
  --muted: #566272;
  --rule: #cdd5de;
  --accent: #1a62c4;
  --accent-ink: #ffffff;
  --accent-soft: rgba(26, 98, 196, 0.1);
  --critical: #b3261e;
  --critical-soft: rgba(179, 38, 30, 0.08);
  --steel: #b4bbc3;
  --edge: #26303c;
  --axis-x: #cc4136;
  --axis-y: #2b8f45;
  --axis-z: #2a6ad2;
  --font-ui: "IBM Plex Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a21; --stage-top: #2b3541; --stage-bottom: #19212a; --panel: #1a2129;
    --ink: #e5eaf0; --muted: #98a4b2; --rule: #2e3a47; --accent: #5e9dff; --accent-ink: #0d1520;
    --accent-soft: rgba(94, 157, 255, 0.14); --critical: #ff8a80; --critical-soft: rgba(255, 138, 128, 0.1);
    --steel: #a9b1ba; --edge: #0f141a; --axis-x: #ff6a5c; --axis-y: #4cc46c; --axis-z: #5e9dff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a21; --stage-top: #2b3541; --stage-bottom: #19212a; --panel: #1a2129;
  --ink: #e5eaf0; --muted: #98a4b2; --rule: #2e3a47; --accent: #5e9dff; --accent-ink: #0d1520;
  --accent-soft: rgba(94, 157, 255, 0.14); --critical: #ff8a80; --critical-soft: rgba(255, 138, 128, 0.1);
  --steel: #a9b1ba; --edge: #0f141a; --axis-x: #ff6a5c; --axis-y: #4cc46c; --axis-z: #5e9dff;
  color-scheme: dark;
}

[hidden] { display: none !important; } /* 部品側の display 指定より hidden 属性を優先する */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font-ui); }
button { font: inherit; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  box-sizing: border-box; height: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 16px;
  padding-inline: 16px; padding-block: 16px;
}

/* ---- 3D ビュー ---- */
.stage {
  position: relative; min-height: 320px; overflow: hidden;
  border: 1px solid var(--rule); border-radius: 10px;
  background: linear-gradient(180deg, var(--stage-top), var(--stage-bottom));
}
.stage .view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .message { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; }
.toolbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; }
.tool-group { display: flex; pointer-events: auto; overflow: hidden; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.tool-group button {
  font: 500 12.5px/1 var(--font-ui); color: var(--ink); background: transparent;
  border: 0; border-inline-end: 1px solid var(--rule); padding: 8px 12px; cursor: pointer;
}
.tool-group button:last-child { border-inline-end: 0; }
.tool-group button:hover { background: var(--accent-soft); }
.tool-group button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.tool-group button:focus-visible { outline-offset: -2px; }
.gizmo { position: absolute; left: 8px; bottom: 8px; width: 76px; height: 76px; pointer-events: none; }
.readout {
  position: absolute; left: 92px; right: 12px; bottom: 14px; min-height: 30px;
  display: flex; align-items: center; pointer-events: none; color: var(--muted); font-size: 12.5px;
}
.readout .chip {
  padding: 4px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--rule);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.readout.is-live { color: var(--ink); }
.readout.is-live .chip { border-color: var(--accent); }

/* ---- 仕様パネル ---- */
.sheet { min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 22px; padding-block: 4px; }
.sheet section { display: flex; flex-direction: column; gap: 10px; }
.eyebrow, .sheet h2 { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.sheet h2 .unit { font-weight: 400; margin-inline-start: 4px; }
.file { display: flex; flex-direction: column; gap: 10px; }
.file-row { display: flex; gap: 12px; align-items: flex-start; }
.file-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.file h1 { margin: 0; font: 500 15px/1.4 var(--font-num); overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 12px; color: var(--muted); }
.thumb { width: 56px; height: 56px; flex: none; border-radius: 6px; border: 1px solid var(--rule); background: var(--stage-bottom); object-fit: cover; }
.badge { margin-inline-start: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--accent); background: var(--accent-soft); }
.primary {
  padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer;
  font-weight: 600; color: var(--accent-ink); background: var(--accent);
}
.primary:hover { filter: brightness(1.08); }
.primary:disabled { cursor: progress; opacity: 0.7; }
.drop-hint { margin: -4px 0 0; font-size: 12px; color: var(--muted); }
kbd { font: 500 11px var(--font-ui); padding: 0 4px; border: 1px solid var(--rule); border-radius: 4px; }
.alert {
  margin: 0; padding: 8px 12px; font-size: 13px; color: var(--critical);
  background: var(--critical-soft); border: 1px solid var(--critical); border-radius: 8px;
}

.dims { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.dims div { padding: 8px 10px; border-inline-end: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.dims div:last-child { border-inline-end: 0; }
.dims dt { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dims dt::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--axis-color); }
.dims dd { margin: 0; font: 500 17px/1.3 var(--font-num); font-variant-numeric: tabular-nums; }

.features { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feature {
  width: 100%; text-align: start; cursor: default; color: var(--ink);
  display: grid; grid-template-columns: 2.6em 1fr auto; column-gap: 10px; row-gap: 2px; align-items: baseline;
  padding: 9px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
}
.feature:hover, .feature.is-active { border-color: var(--accent); background: var(--accent-soft); }
.feature .kind { font-size: 12px; font-weight: 600; color: var(--muted); }
.feature .dim { font: 500 16px/1.3 var(--font-num); font-variant-numeric: tabular-nums; }
.feature .count { font: 500 13px var(--font-num); color: var(--muted); }
.feature .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }

.topology { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 4px; font-size: 13px; }
.topology dt { color: var(--muted); }
.topology dd { margin: 0; font-variant-numeric: tabular-nums; }

.structure summary { cursor: pointer; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.structure p { margin: 6px 0; font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
.structure table { width: 100%; border-collapse: collapse; font-size: 12px; }
.structure th { text-align: start; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--rule); padding: 4px 6px; }
.structure td { padding: 3px 6px; border-bottom: 1px solid var(--rule); }
.structure .num { text-align: end; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hint { margin: 0; margin-block-start: auto; font-size: 12px; color: var(--muted); }

.drop-overlay {
  position: fixed; inset: 12px; z-index: 10; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: 14px; background: var(--accent-soft);
  backdrop-filter: blur(2px); pointer-events: none;
}
.drop-overlay p { margin: 0; padding: 12px 20px; border-radius: 10px; background: var(--panel); color: var(--ink); font-weight: 600; }

@media (max-width: 760px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; }
  .readout { left: 88px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <main class="stage" id="stage" aria-label="3D ビュー">
    <canvas class="view" id="view"></canvas>
    <div class="toolbar">
      <div class="tool-group" role="group" aria-label="視点">
        <button type="button" data-view="iso" title="等角ビュー（ホーム）">等角</button>
        <button type="button" data-view="top" title="上から見る">上</button>
        <button type="button" data-view="front" title="前から見る">前</button>
        <button type="button" data-view="right" title="右から見る">右</button>
      </div>
      <div class="tool-group" role="group" aria-label="表示">
        <button type="button" id="toggle-edges" aria-pressed="true">稜線</button>
        <button type="button" id="fit" title="モデル全体が収まるように表示">全体表示</button>
      </div>
    </div>
    <canvas class="gizmo" id="gizmo" width="152" height="152" aria-hidden="true"></canvas>
    <div class="readout" id="readout" aria-live="polite"><span class="chip">面にカーソルを合わせると、種類と寸法を表示します</span></div>
  </main>

  <aside class="sheet" aria-label="部品の仕様">
    <header class="file">
      <div class="file-row">
        <img class="thumb" id="thumb" alt="Inventor が保存したサムネイル" title="Inventor が保存したサムネイル（表示の見比べ用）" hidden>
        <div class="file-text">
          <p class="eyebrow">部品ファイル<span class="badge" id="sample-badge" hidden>サンプル</span></p>
          <h1 id="file-name">—</h1>
          <p class="meta" id="file-source"></p>
        </div>
      </div>
      <button type="button" class="primary" id="open">ipt ファイルを開く</button>
      <p class="drop-hint">画面へのドラッグ＆ドロップ、または <kbd>Ctrl</kbd>+<kbd>O</kbd> でも開けます</p>
      <input type="file" id="file-input" accept=".ipt" hidden>
      <p class="alert" id="alert" role="alert" hidden></p>
    </header>
    <section>
      <h2>外形寸法<span class="unit">mm</span></h2>
      <dl class="dims" id="dims"></dl>
    </section>
    <section>
      <h2>形状要素</h2>
      <ul class="features" id="features"></ul>
    </section>
    <section>
      <h2>位相</h2>
      <dl class="topology" id="topology"></dl>
    </section>
    <details class="structure">
      <summary>ファイル構造</summary>
      <p id="structure-summary"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>セグメント</th><th class="num">格納</th><th class="num">展開後</th><th>圧縮</th></tr></thead>
          <tbody id="segments"></tbody>
        </table>
      </div>
    </details>
    <p class="hint">ドラッグで回転、右ドラッグで移動、ホイールで拡大縮小。形状要素にカーソルを合わせると、該当する面が強調されます。ファイルはブラウザ内だけで解析し、外部には送信しません。</p>
  </aside>
</div>
<div class="drop-overlay" id="drop-overlay" hidden><p>ドロップして開く（.ipt）</p></div>
